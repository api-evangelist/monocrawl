  /v1/web/extract:
    get:
      operationId: web_extract
      tags:
      - Web Scraping
      summary: Extract structured data from a web page
      description: 'Deterministic structured extraction from a public page: meta/Open Graph/Twitter tags, parsed JSON-LD blocks, canonical URL, feeds, and heading outline — no AI involved. Fetch modes: direct by default; browser, enhanced and rendered are deployment-gated and off by default. Requested output shapes are unchanged. An unavailable non-direct mode returns 424 rather than silently ignoring the requested mode. Costs 1 credit per successful live response.'
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
        example: https://example.com
        description: Page URL to extract from (http/https, public hosts only)
      - name: timeout
        in: query
        required: false
        schema:
          type: string
        example: '10000'
        description: Fetch budget in milliseconds, clamped to 1000-15000
      - name: fetch_mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - direct
          - browser
          - enhanced
          - rendered
        example: direct
        description: 'Fetch mode: direct (default) reads static HTML; browser explicitly runs JavaScript in an owned, isolated browser. Enhanced and rendered try direct first and permit configured fallbacks. Non-direct modes require deployment enablement, an approved target and applicable resource or spending limits; otherwise the request is refused. Output formats are unchanged. Accepted values: direct, browser, enhanced, rendered. Case, spaces, hyphens and underscores are interchangeable.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/web/extract.json
                      title: web/extract data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        url:
                          type:
                          - string
                          - 'null'
                          description: url
                        final_url:
                          type:
                          - string
                          - 'null'
                          description: final url
                        title:
                          type:
                          - string
                          - 'null'
                          description: title
                        description:
                          type:
                          - string
                          - 'null'
                          description: description
                        text:
                          type:
                          - string
                          description: text
                          minLength: 1
                        markdown:
                          type:
                          - string
                          - 'null'
                          description: markdown
                        content:
                          type:
                          - object
                          - 'null'
                          properties: {}
                          additionalProperties: true
                        publication:
                          type:
                          - object
                          - 'null'
                          properties: {}
                          additionalProperties: true
                        metadata:
                          type:
                          - object
                          - 'null'
                          properties: {}
                          additionalProperties: true
                        _warnings:
