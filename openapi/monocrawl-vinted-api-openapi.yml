  /v1/vinted/search:
    get:
      operationId: vinted_search
      tags:
      - Vinted
      summary: Vinted item search
      description: Search second-hand items with prices, currencies, photos, brand, size, condition and seller identifiers. Uses cursor pagination; prices are asking prices. Costs 1 credit per successful live response.
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        example: Levis 501
        description: 'Required, non-empty search text, up to 200 characters. For example: Levis 501. Blank searches are rejected before any source call or credit reservation.'
      - name: market
        in: query
        required: false
        schema:
          type: string
          enum:
          - gb
          - fr
        x-value-aliases:
          uk: gb
        example: gb
        description: 'Market: gb or fr. Default gb. Accepted values: gb, fr. Case, spaces, hyphens and underscores are interchangeable.'
      - name: min_price
        in: query
        required: false
        schema:
          type: string
        example: '10'
        description: Minimum item asking price.
      - name: max_price
        in: query
        required: false
        schema:
          type: string
        example: '50'
        description: Maximum item asking price.
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '10'
        description: Results per page, 1 to 50. Keep unchanged between pages.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Opaque continuation from this operation; preserve all original parameters.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
