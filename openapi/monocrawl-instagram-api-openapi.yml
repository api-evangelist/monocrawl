  /v1/instagram/comment-replies:
    get:
      operationId: instagram_comment_replies
      tags:
      - Instagram
      summary: Comment replies
      description: The reply thread under one Instagram comment. Paged by cursor. Costs 2 credits per successful live response.
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
        example: https://www.instagram.com/reel/C8rKmYvsrck
        description: Full Instagram post/reel URL.
      - name: comment_id
