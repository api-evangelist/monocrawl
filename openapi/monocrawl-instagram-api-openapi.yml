                          properties:
                            country:
                              type:
                              - string
                              description: country
                              minLength: 1
                        - required:
                          - verified_on
                          properties:
                            verified_on:
                              type:
                              - string
                              description: verified on
                              minLength: 1
                        - required:
                          - active_ads
                          properties:
                            active_ads:
                              type:
                              - string
                              description: active ads
                              minLength: 1
                        - required:
                          - former_usernames_count
                          properties:
                            former_usernames_count:
                              type:
                              - number
                              description: former usernames count; null is unknown.
                        - required:
                          - accounts_with_shared_followers
                          properties:
                            accounts_with_shared_followers:
                              type:
                              - number
                              description: accounts with shared followers; null is unknown.
                        - required:
                          - verified
                          properties:
                            verified:
                              type:
                              - boolean
                              description: Source verification flag.
