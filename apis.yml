aid: monocrawl
name: Monocrawl
image: https://www.monocrawl.com/images/brand/monocrawl-social-v2.png
description: Monocrawl provides a unified REST API that aggregates public social, search and e-commerce data from over 70 platforms, including
  TikTok, Reddit, YouTube, Instagram, X, LinkedIn, Google, Amazon, eBay, Airbnb and more. It enables developers and AI agents to retrieve posts,
  products, reviews, profiles, and other public content through a single key and unified schema, supporting use cases like brand monitoring, competitor
  tracking, review analysis, and AI-driven insights. The service offers free starter credits and tiered pricing for scaling usage.
