      - name: url
        in: query
        required: true
        schema:
          type: string
        example: https://www.facebook.com/events/explore/saint-petersburg-florida/111326725552547
        description: A city's Facebook events page URL
      - name: time
        in: query
        required: false
        schema:
          type: string
          enum:
          - today
          - this_week
          - next_week
        example: this_week
        description: 'today, this_week or next_week; omitted = all time Accepted values: today, this_week, next_week. Case, spaces, hyphens and underscores are interchangeable.'
