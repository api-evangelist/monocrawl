  /v1/youtube/channel/videos:
    get:
      operationId: youtube_channel_videos
      tags:
      - Youtube
      summary: Channel uploads
      description: Retrieve videos from the channel uploads playlist in source order. This is an uploads-playlist collection, not every channel tab; popularity sorting is not supported. Costs 1 credit per successful live response.
      parameters:
      - name: channelId
        in: query
        required: false
        schema:
          type: string
        example: UC_x5XG1OV2P6uZZ5FSM9Ttw
        description: Channel id. One of channelId, handle or url is required
      - name: handle
        in: query
        required: false
        schema:
          type: string
        example: '@googledevelopers'
        description: Channel @handle
      - name: url
        in: query
        required: false
        schema:
          type: string
        example: https://www.youtube.com/@googledevelopers
        description: Any channel URL
      - name: max_results
        in: query
        required: false
        schema:
          type: string
        example: '50'
