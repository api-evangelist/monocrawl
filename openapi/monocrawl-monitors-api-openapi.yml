  /v1/monitors/delete:
    delete:
      operationId: monitors_delete
      tags:
      - Monitors
      summary: Delete a monitor
      description: 'Permanently delete one of your monitors and its recorded run history, and cancel any check already queued for it. A Monocrawl extra: the reference catalogue catalogue has no monitor delete call, which makes its per-account monitor limit unrecoverable. This cannot be undone. Free — costs 0 credits.'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        example: mon_0f2c8b1d4e6a7c9b0d1e2f3a
        description: Monitor id
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: confirm
        in: query
        required: true
        schema:
          type: string
        example: 'true'
        description: Set to true to permanently delete this monitor. Send an HTTP DELETE request; GET never deletes.
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/monitors/delete.json
                      title: monitors/delete data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: id
                        name:
                          type:
                          - string
                          - 'null'
                          description: name
                        runs_deleted:
                          type:
                          - string
                          - 'null'
                          description: runs deleted
                        deleted:
                          type:
                          - boolean
                          - 'null'
                        cancelled_checks:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                      additionalProperties: true
                      allOf:
                      - anyOf:
                        - required:
                          - id
                          properties:
                            id:
                              type:
                              - string
                              description: id
                              minLength: 1
                        - required:
                          - name
                          properties:
                            name:
                              type:
                              - string
                              description: name
                              minLength: 1
                        - required:
                          - runs_deleted
                          properties:
                            runs_deleted:
                              type:
                              - string
                              description: runs deleted
                              minLength: 1
                        - required:
                          - deleted
                          properties:
                            deleted:
                              type:
                              - boolean
                        - required:
                          - cancelled_checks
                          properties:
