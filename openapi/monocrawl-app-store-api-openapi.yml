  /v1/app_store/app-reviews:
    get:
      operationId: app_store_app_reviews
      tags:
      - App Store
      summary: App Store app reviews
      description: Retrieve App Store reviews in source pages of up to 50 reviews. Depth counts pages; rating filters apply locally after collection and do not guarantee a full page of matches. Costs 2 credits per successful live response.
      parameters:
      - name: app_id
        in: query
        required: true
        schema:
          type: string
        example: '324684580'
        description: Numeric App Store track id
      - name: country
        in: query
        required: false
        schema:
          type: string
        example: us
        description: 2-letter storefront country code (default us)
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: en_us
        description: Not supported by the Apple reviews feed; acknowledged in _warnings and ignored
      - name: depth
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Number of source pages, each containing up to 50 reviews; not a review count. Rating filters are applied locally to the retrieved pages and can return fewer or zero matches.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - mostrecent
          - mosthelpful
        x-value-aliases:
          newest: mostrecent
          recent: mostrecent
          helpful: mosthelpful
        example: mostrecent
        description: 'mostrecent (default) or mosthelpful Accepted values: mostrecent, mosthelpful. Case, spaces, hyphens and underscores are interchangeable.'
      - name: rating
        in: query
        required: false
        schema:
          type: string
        example: '5'
        description: 1-5; filter applied locally after fetch (noted in _warnings)
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Return the previous response cursor unchanged. Keep app_id, country, language, depth, sort_by and rating unchanged. Recent reviews can continue through source page 10; mosthelpful is a single feed. Each request retains the normal price.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: judgments
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'on'
          - 'off'
        example: 'on'
        description: 'Add bounded AI labels to eligible returned records (default on). off preserves the original data shape. Unclassified records remain present; labels depend on evidence, time, capacity and the existing request budget. No label surcharge. Accepted values: on, off. Case, spaces, hyphens and underscores are interchangeable.'
      - name: label
        in: query
        required: false
        schema:
          type: string
          enum:
          - default
          - none
        example: none
        description: 'Set none to disable labels; default enables the endpoint’s label set. Equivalent to judgments=off. Accepted values: default, none. Case, spaces, hyphens and underscores are interchangeable.'
      - name: label_evidence
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Include exact supporting sentences and zero-based sentence indexes when a label has validated evidence. No extra charge or change to decisions. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: exclude
        in: query
        required: false
        schema:
          type: string
          enum:
          - engagement_bait
        example: engagement_bait
        description: 'Optionally remove confidently labelled engagement bait. Uncertain and unclassified records stay; removed IDs and an owner-bound recall reference are returned. Accepted values: engagement_bait. Case, spaces, hyphens and underscores are interchangeable.'
      - name: fit
        in: query
        required: false
        schema:
          type: string
          enum:
          - goal
        example: goal
        description: 'Use goal to replace confidently irrelevant records with recall stubs. Keeps first, last, relevant and uncertain records; preserves order. Full evidence is stored for 24 hours when available. Accepted values: goal. Case, spaces, hyphens and underscores are interchangeable.'
      - name: goal
        in: query
        required: false
        schema:
          type: string
        example: Find concrete product complaints
        description: 'Required with fit=goal: describe the task in at most 600 characters. Supplied text is task context, never permission to act on posts.'
      - name: tokens
        in: query
        required: false
        schema:
          type: string
        example: '4000'
        description: Optional soft response target for fit=goal, 256–32000. Safety and evidence retention take priority, so the returned result may exceed it.
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/app_store/app-reviews.json
                      title: app_store/app-reviews data fields
                      description: Optional data supplied by this operation. Null means unknown.
                      type: object
                      anyOf:
                      - type: object
                        properties:
                          _warnings:
                            description: Optional  warnings supplied by this operation. Null means unknown.
                            type:
                            - array
                            - 'null'
                            items:
                              description: Optional record supplied by this operation. Null means unknown.
                              type:
                              - string
                              - 'null'
                          app_id:
                            description: Optional app id supplied by this operation. Null means unknown.
                            type:
                            - string
                            - 'null'
                          count:
                            description: Number of records in this response, not lifetime or total matches.
                            type:
                            - number
                            - 'null'
                          country:
                            description: Optional country supplied by this operation. Null means unknown.
                            type:
                            - string
                            - 'null'
                          cursor:
                            description: Opaque next-page token; pass it back unchanged. Null does not prove complete history.
                            type:
                            - string
                            - 'null'
                          items:
