                          - 'null'
                          description: status
                        name:
                          type:
                          - string
                          - 'null'
                          description: name
                        kind:
                          type:
                          - string
                          - 'null'
                          description: kind
                        created_at:
                          type:
                          - string
                          - 'null'
                          description: created at
                        next_run_at:
                          type:
                          - string
                          - 'null'
                          description: next run at
                        target:
                          type:
                          - object
                          - 'null'
                          properties:
                            platform:
                              type:
                              - string
                              - 'null'
                              description: platform
                            endpoint:
                              type:
                              - string
                              - 'null'
                              description: endpoint
                          additionalProperties: true
                        schedule_minutes:
                          type:
                          - number
                          - 'null'
                          description: Configured check interval in minutes.
                        estimated_credits_per_run:
                          type:
                          - number
