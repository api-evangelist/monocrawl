      tags:
      - Content Analysis
      summary: Keyword mention trends
      description: Mention volume and sentiment for a keyword bucketed by day, week or month across the sources we can reach. Bucket heights are bounded by each source's per-query cap, so the series is a shape, not a census — the response says so explicitly. Costs 5 credits per successful live response.
      parameters:
      - name: keyword
        in: query
        required: true
        schema:
          type: string
        example: kubernetes
        description: Phrase to trend
      - name: date_from
        in: query
        required: true
        schema:
          type: string
        example: '2026-08-01'
        description: ISO-8601 start of the window
      - name: date_to
        in: query
        required: false
        schema:
          type: string
        example: '2026-08-31'
        description: ISO-8601 end of the window (default now)
      - name: date_group
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
        example: day
        description: 'day (default), week or month; max 400 buckets Accepted values: day, week, month. Case, spaces, hyphens and underscores are interchangeable.'
      - name: page_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - news
          - forum
          - social
          - discussion
        example: all
        description: 'all, news, forum, social or discussion Accepted values: all, news, forum, social, discussion. Case, spaces, hyphens and underscores are interchangeable.'
      - name: internal_list_limit
        in: query
        required: false
        schema:
          type: string
        example: '10'
        description: Length of the embedded top-terms list (max 50)
      - name: depth
        in: query
        required: false
        schema:
          type: string
        example: '100'
        description: Items fetched PER SOURCE before bucketing (max 100)
      - name: filters
        in: query
        required: false
        schema:
          type: string
        example: source:eq:hackernews
        description: field:op:value segments joined by ; — see /v1/content_analysis/filters
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
