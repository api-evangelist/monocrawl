  /v1/x/following:
    get:
      operationId: x_following
      tags:
      - X
      summary: Following
      description: The accounts an X account follows, as profile cards — handle, name, bio, location, follower/following/post counts, join date, avatar — up to 200 a page with cursor pagination. Costs 3 credits per successful live response.
      parameters:
      - name: handle
        in: query
        required: true
        schema:
          type: string
        example: monzo
        description: X username without the @. An optional leading @ is accepted and removed before lookup.
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '5'
        description: Requested rows per response, 1–1000. The source may return fewer. Remaining rows from an already purchased page use a saved cursor and cost zero to retrieve for up to one hour; further native source pages use this endpoint’s normal price.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Use the returned cursor unchanged, retaining the original query, filters and limit. Saved mlo1. cursors retrieve already purchased rows at zero credits for up to one hour. A native source cursor, when supplied, starts a normally priced source page. Quote with dry_run before continuing.
