                          type:
                          - boolean
                          - 'null'
                        interval:
                          description: Optional interval supplied by this operation. Null means unknown.
                          type:
                          - string
                          - 'null'
                        items:
                          description: Returned records. Source coverage and completeness vary.
                          type:
                          - array
                          items:
                            description: Optional record supplied by this operation. Null means unknown.
                            type: object
