  /v1/content_analysis/summary:
    get:
      operationId: content_analysis_summary
      tags:
      - Content Analysis
      summary: Keyword mention summary
      description: 'Aggregate view of a keyword''s mentions: volume, per-source breakdown, sentiment split, category mix, top publishers and top terms — all computed deterministically from the mentions we could reach. Costs 3 credits per successful live response.'
      parameters:
      - name: keyword
        in: query
        required: true
        schema:
          type: string
        example: kubernetes
        description: Phrase to summarise mentions of
      - name: page_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - news
          - forum
          - social
          - discussion
        example: all
        description: 'all, news, forum, social or discussion Accepted values: all, news, forum, social, discussion. Case, spaces, hyphens and underscores are interchangeable.'
      - name: positive_connotation_threshold
        in: query
        required: false
        schema:
          type: string
        example: '0.25'
        description: Score in (0,1] at or above which a mention is positive
      - name: sentiments_connotation_threshold
        in: query
        required: false
        schema:
          type: string
        example: '0.25'
        description: Score magnitude at or below which a mention is negative
      - name: internal_list_limit
        in: query
        required: false
        schema:
          type: string
        example: '10'
        description: Length of the embedded top-terms / category / publisher lists (max 50)
      - name: depth
        in: query
        required: false
        schema:
          type: string
        example: '50'
        description: Items fetched PER SOURCE before aggregating (max 100)
      - name: filters
        in: query
        required: false
        schema:
          type: string
        example: category:eq:reliability_outage
        description: field:op:value segments joined by ; — see /v1/content_analysis/filters
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
