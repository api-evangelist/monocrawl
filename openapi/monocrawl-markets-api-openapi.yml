                                properties:
                                  volume:
                                    description: Optional volume supplied by this operation. Null means unknown.
                                    type:
                                    - number
                        name:
                          description: Optional name supplied by this operation. Null means unknown.
                          type:
                          - string
                          - 'null'
                        previous_close:
                          description: Optional previous close supplied by this operation. Null means unknown.
                          type:
