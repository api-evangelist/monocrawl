      - name: url
        in: query
        required: false
        schema:
          type: string
        example: https://open.spotify.com/album/4aawyAB9vmqN3uQ7FjRGTy
        description: 'open.spotify.com album URL or spotify:album: URI (this or id)'
      - name: market
        in: query
        required: false
        schema:
          type: string
        example: US
        description: ISO 3166-1 alpha-2 country to scope availability (optional)
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
