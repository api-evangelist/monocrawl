  /v1/google_trends/trending:
    get:
      operationId: google_trends_trending
      tags:
      - Google Trends
      summary: Trending searches
      description: Trending searches, approximate volumes, timing, categories, breakdowns and up to three related articles, read from the public Trending Now page. Costs 2 credits per successful live response.
      parameters:
      - name: location
        in: query
        required: true
        schema:
          type: string
        example: DE
        description: Country or region code
      - name: hours
        in: query
        required: false
        schema:
          type: string
          enum:
          - '4'
          - '24'
          - '48'
          - '168'
        example: '24'
        description: '4, 24, 48 or 168 Accepted values: 4, 24, 48, 168. Case, spaces, hyphens and underscores are interchangeable.'
      - name: category
        in: query
        required: false
        schema:
          type: string
        example: all
        description: Category ID or page category name
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - active
          - ended
        example: all
        description: 'all, active or ended Accepted values: all, active, ended. Case, spaces, hyphens and underscores are interchangeable.'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - relevance
          - volume
          - recency
          - title
        example: relevance
        description: 'relevance, volume, recency or title Accepted values: relevance, volume, recency, title. Case, spaces, hyphens and underscores are interchangeable.'
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '20'
        description: Whole number from 1 to 100
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
