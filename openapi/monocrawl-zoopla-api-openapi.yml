  /v1/zoopla/agents:
    get:
      operationId: zoopla_agents
      tags:
      - Zoopla
      summary: Zoopla agents
      description: 'The agent branches in an area with each one''s market figures: homes available, average asking price and weeks on the market, for sale and to rent. Costs 2 credits per successful live response.'
      parameters:
      - name: location
        in: query
        required: false
        schema:
          type: string
        example: Oxford
        description: A postcode, town or area name; resolved once and remembered (or pass identifier)
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        example: oxford
        description: An area identifier from zoopla/locations or a path from zoopla/area
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Page number (25 a page)
      - name: radius
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '0.25'
          - '0.5'
          - '1'
          - '3'
          - '5'
          - '10'
          - '15'
          - '20'
          - '30'
          - '40'
        example: ''
        description: 'Miles around the area: 0, 0.25, 0.5, 1, 3, 5, 10, 15, 20, 30 or 40 Accepted values: 0, 0.25, 0.5, 1, 3, 5, 10, 15, 20, 30, 40. Case, spaces, hyphens and underscores are interchangeable.'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - sales
          - lettings
          - commercial
          - estate-agents
          - letting-agents
          - commercial-agents
        example: ''
        description: 'sales, lettings or commercial Accepted values: sales, lettings, commercial, estate-agents, letting-agents, commercial-agents. Case, spaces, hyphens and underscores are interchangeable.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Only agents whose name contains this
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - a_z
          - shortest_avg_age
          - highest_avg_price
          - lowest_avg_price
        example: a_z
        description: 'a_z, shortest_avg_age, highest_avg_price or lowest_avg_price Accepted values: a_z, shortest_avg_age, highest_avg_price, lowest_avg_price. Case, spaces, hyphens and underscores are interchangeable.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
