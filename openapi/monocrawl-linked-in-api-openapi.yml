      summary: LinkedIn member recommendations
      description: 'The recommendations a member received or gave, one page at a time: text, date, relationship and the recommender. Source expansion is not available for every profile. A refused section returns an uncharged error; an empty section with a positive source total is explicitly partial. A profile URL may require a separate identity lookup within the quoted request. Costs 16 credits per successful live response.'
