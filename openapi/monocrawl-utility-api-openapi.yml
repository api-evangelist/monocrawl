                                      - 'null'
                                      description: production available
                                    live_proven:
                                      type:
                                      - boolean
                                      - 'null'
                                      description: live proven
                                  additionalProperties: true
                            additionalProperties: true
                            allOf:
                            - anyOf:
                              - required:
                                - name
