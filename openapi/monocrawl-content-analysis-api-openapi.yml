  /v1/content_analysis/sentiment:
    get:
      operationId: content_analysis_sentiment
      tags:
      - Content Analysis
      summary: Keyword sentiment breakdown
      description: Positive / neutral / negative split for a keyword with mean, median and a score histogram, plus the most positive and most negative mentions. Lexicon-based and fully deterministic — the method, its thresholds and its limits are returned with every response. Costs 3 credits per successful live response.
      parameters:
      - name: keyword
        in: query
        required: true
        schema:
          type: string
        example: kubernetes
        description: Phrase to score
      - name: page_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - news
          - forum
          - social
          - discussion
        example: all
        description: 'all, news, forum, social or discussion Accepted values: all, news, forum, social, discussion. Case, spaces, hyphens and underscores are interchangeable.'
      - name: positive_connotation_threshold
        in: query
        required: false
        schema:
          type: string
        example: '0.25'
        description: Score in (0,1] at or above which a mention is positive
      - name: sentiments_connotation_threshold
        in: query
        required: false
        schema:
          type: string
        example: '0.25'
        description: Score magnitude at or below which a mention is negative
      - name: depth
        in: query
        required: false
        schema:
          type: string
        example: '50'
        description: Items fetched PER SOURCE before aggregating (max 100)
      - name: filters
        in: query
        required: false
        schema:
          type: string
        example: source:eq:hackernews
        description: field:op:value segments joined by ; — see /v1/content_analysis/filters
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
