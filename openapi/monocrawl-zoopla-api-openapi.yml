      summary: Zoopla agent
      description: 'One agent branch''s page: address, telephone, website and social links, memberships, description, photos and position. Costs 2 credits per successful live response.'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        example: '55447'
        description: The branch id from zoopla/agents (or pass url, the branch's page)
      - name: url
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: The branch's page URL instead of an id
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
