      description: Reels that use a specific audio track — sound-trend intelligence for Instagram. Paged by cursor. Costs 1 credit per successful live response.
      parameters:
      - name: audio_id
        in: query
        required: true
        schema:
          type: string
        example: '1392969992841787'
        description: Instagram audio id.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous page.
      - name: include_audio
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        x-value-aliases:
          '0': 'false'
          '1': 'true'
        example: 'true'
        description: 'Opt in to a native audio page with sound metadata, supplied reel total and trend flags at the same price. Results can differ from ordinary audio search. Later pages may retain first-page metadata; check scope and observation times. Keep the option with its cursor. Accepted values: true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
