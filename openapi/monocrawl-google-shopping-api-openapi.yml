info:
  title: Monocrawl Google Shopping API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Google Shopping
paths:
  /v1/google_shopping/deals:
    get:
      operationId: google_shopping_deals
      tags:
      - Google Shopping
      summary: Google Shopping deals
      description: Discounted products for a query on Google Shopping with sale and original price, discount and store. Costs 2 credits per successful live response.
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        example: laptop
        description: Search terms
      - name: location
        in: query
        required: false
        schema:
          type: string
        example: United Kingdom
        description: Country name (default United Kingdom)
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: en
        description: Language code
      - name: min_price
        in: query
        required: false
        schema:
          type: string
        example: '100'
        description: Lowest price
      - name: max_price
        in: query
        required: false
        schema:
          type: string
        example: '900'
        description: Highest price
      - name: stores
        in: query
        required: false
        schema:
          type: string
        example: argos,currys
        description: Store names, comma-separated
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '40'
        description: Results, up to 120
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Page
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
