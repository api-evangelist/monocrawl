      - name: handle
        in: query
        required: true
        schema:
          type: string
        example: mrtiktokreviews
        description: TikTok username without the @.
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Two-letter region code. The current source only serves US; other regions may return source-unavailable without a customer charge. Region is never silently changed.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous page.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
