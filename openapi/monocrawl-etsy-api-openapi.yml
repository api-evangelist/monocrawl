      - name: depth
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Tree depth, 1-3
      - name: query
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Category name search
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
