                        is_pull_request:
                          type:
                          - boolean
                          - 'null'
                          description: Whether the source item is a pull request.
                        author:
                          type:
                          - string
                          - 'null'
                          description: Author login.
                        comments:
                          type:
                          - number
                          - 'null'
                          description: Comments reported by the source; null or absent is unknown, not zero.
                        created_at:
                          type:
                          - string
                          - 'null'
                          description: Source publication time, normalized to an ISO date-time when available.
                        updated_at:
                          type:
                          - string
                          - 'null'
                          description: Source publication time, normalized to an ISO date-time when available.
                        _warnings:
                          type: array
                          items:
                            type: string
                          description: Collection limitations or component warnings. Read before interpreting coverage.
                      additionalProperties: true
