openapi: 3.2.0
info:
  title: Monocrawl Rightmove API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Rightmove
paths:
  /v1/rightmove/agents:
    get:
      operationId: rightmove_agents
      tags:
      - Rightmove
      summary: Rightmove estate agents
      description: 'The estate-agent branches in an area: brand, branch, summary, whether they sell or let, logo and telephone numbers. Costs 2 credits per successful live response.'
      parameters:
      - name: location
        in: query
        required: false
        schema:
          type: string
        example: Birmingham
        description: A postcode, town or area name; resolved once and remembered (or pass identifier)
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        example: REGION^1036
        description: An area identifier from rightmove/locations
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Page number (default 1). Use page or the returned cursor, not both.
      - name: radius
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '0.25'
          - '0.5'
          - '1'
          - '3'
          - '5'
          - '10'
          - '15'
          - '20'
          - '30'
          - '40'
        example: ''
        description: 'Miles around the area: 0, 0.25, 0.5, 1, 3, 5, 10, 15, 20, 30 or 40 Accepted values: 0, 0.25, 0.5, 1, 3, 5, 10, 15, 20, 30, 40. Case, spaces, hyphens and underscores are interchangeable.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Only branches whose name contains this
      - name: branch_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - sales
          - lettings
        example: ''
        description: 'The portal''s branch type filter Accepted values: sales, lettings. Case, spaces, hyphens and underscores are interchangeable.'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Return the previous response cursor unchanged to continue with the same source. Keep the same location or identifier, radius, name and branch_type; omit page. Each fetched page costs the normal two credits.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
