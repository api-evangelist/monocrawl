      description: Search Bing's aggregated job postings by location and keywords. Costs 3 credits per successful live response.
      parameters:
      - name: location
        in: query
        required: true
        schema:
          type: string
        example: Switzerland
        description: Country or city
      - name: query
        in: query
        required: false
        schema:
          type: string
        example: java
        description: Keywords, title, company or position
      - name: date_posted
        in: query
        required: false
        schema:
          type: string
          enum:
          - week
          - day
        example: week
        description: 'week or day Accepted values: week, day. Case, spaces, hyphens and underscores are interchangeable.'
      - name: employment_types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - contractor
            - fulltime
            - parttime
            - temporary
        style: form
        explode: false
        example:
        - fulltime
        description: 'contractor, fulltime, parttime or temporary Accepted values (comma-separated): contractor, fulltime, parttime, temporary. Case, spaces, hyphens and underscores are interchangeable.'
      - name: remote_only
        in: query
        required: false
        schema:
          type: string
        example: 'true'
        description: true to keep remote roles only
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Cursor from the previous page
