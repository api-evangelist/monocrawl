      summary: Home Depot product reviews
      description: 'Reviews of a Home Depot product with rating, author, photos and store responses. Costs 3 credits per successful live response. Limited capacity: this operation currently relies on small shared monthly allowances. Availability can end before your account credits are used. Contact support before scheduling or bulk use. Allowances are shared across customers and related operations; this is not a per-account entitlement.'
