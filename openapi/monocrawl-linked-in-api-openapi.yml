  /v1/linkedin/group-posts:
    get:
      operationId: linkedin_group_posts
      tags:
      - Linked In
      summary: LinkedIn group posts
      description: Posts in a LinkedIn group with available text, media, engagement and author. Continue with the returned cursor and the same group and account; when a cursor is returned it is required for that source's next page. A page number alone does not switch an existing traversal to another source. Total collection size and completeness may be unknown. Costs 5 credits per successful live response.
      parameters:
      - name: group_id
        in: query
        required: true
        schema:
          type: string
        example: '62438'
        description: A LinkedIn group id or URL
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Page number, starting at 1. With a returned cursor, omit page or supply the matching next page. A page number alone cannot continue a source that requires its cursor.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Opaque continuation from the previous response. Keep the same group and account; do not edit the token. Required for subsequent pages when returned.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: judgments
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'on'
          - 'off'
        example: 'on'
        description: 'Add bounded AI labels to eligible returned records (default on). off preserves the original data shape. Unclassified records remain present; labels depend on evidence, time, capacity and the existing request budget. No label surcharge. Accepted values: on, off. Case, spaces, hyphens and underscores are interchangeable.'
      - name: label
        in: query
        required: false
        schema:
          type: string
          enum:
          - default
          - none
        example: none
        description: 'Set none to disable labels; default enables the endpoint’s label set. Equivalent to judgments=off. Accepted values: default, none. Case, spaces, hyphens and underscores are interchangeable.'
