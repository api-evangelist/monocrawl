        description: Adults, up to 16
      - name: children
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Children, up to 15
      - name: infants
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Infants, up to 5
      - name: pets
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Pets, up to 5
      - name: currency
        in: query
        required: false
        schema:
          type: string
        example: GBP
        description: Three-letter currency code
      - name: language
