openapi: 3.2.0
info:
  title: Monocrawl Web Scraping API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Web Scraping
paths:
  /v1/web/agent:
    get:
      operationId: web_agent
      tags:
      - Web Scraping
      summary: Browser agent
      description: 'Start an asynchronous browser agent: a hosted browser opens the page and the platform''s model chooses navigate, click, type or done for up to eight steps. Returns a job; poll /v1/web/jobs/{job_id} for the final page, the extracted answer and every step taken. Costs 10 credits per successful live response.'
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
        example: https://www.gov.uk/bank-holidays
        description: Page to start from (http/https)
      - name: prompt
        in: query
        required: true
        schema:
          type: string
        example: Find the date of the next bank holiday in England and Wales
        description: What the agent should do or find (up to 2,000 characters)
      - name: max_steps
        in: query
        required: false
        schema:
          type: string
        example: '6'
        description: Most actions to take, 1 to 8 (default 8)
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/web/agent.json
                      title: web/agent data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: Exact source identifier; preserve it as a string.
                        kind:
                          type:
                          - string
                          - 'null'
                          description: kind
                        status:
                          type:
                          - string
                          - 'null'
                          description: status
                        created_at:
                          type:
                          - string
                          - 'null'
                          description: created at
                        started_at:
                          type:
                          - string
                          - 'null'
                          description: started at
                        completed_at:
                          type:
                          - string
                          - 'null'
                          description: completed at
                        poll:
                          type:
                          - string
                          - 'null'
                          description: poll
                        refund_status:
                          type:
                          - string
                          - 'null'
                          description: refund status
                        credits_charged:
                          type:
                          - number
                          - 'null'
                          description: credits charged; null is unknown.
                        credits_refunded:
                          type:
                          - number
                          - 'null'
                          description: credits refunded; null is unknown.
                        attempts:
                          type:
                          - number
                          - 'null'
                          description: attempts; null is unknown.
                        progress:
                          type:
                          - object
                          - 'null'
                          properties: {}
                          additionalProperties: true
                        result:
                          type:
                          - object
                          - 'null'
                          properties: {}
                          additionalProperties: true
                        error:
                          type:
                          - string
                          - 'null'
                          description: Failure details if present.
                      additionalProperties: true
                      allOf:
                      - anyOf:
                        - required:
                          - id
                          properties:
                            id:
                              type:
                              - string
                              description: Exact source identifier; preserve it as a string.
                              minLength: 1
                        - required:
                          - created_at
                          properties:
                            created_at:
                              type:
                              - string
                              description: created at
                              minLength: 1
                        - required:
                          - started_at
                          properties:
                            started_at:
                              type:
                              - string
                              description: started at
                              minLength: 1
                        - required:
                          - completed_at
                          properties:
                            completed_at:
                              type:
                              - string
                              description: completed at
                              minLength: 1
                        - required:
                          - poll
                          properties:
                            poll:
                              type:
                              - string
                              description: poll
                              minLength: 1
                        - required:
                          - refund_status
                          properties:
                            refund_status:
                              type:
                              - string
                              description: refund status
                              minLength: 1
                        - required:
                          - credits_charged
                          properties:
                            credits_charged:
                              type:
                              - number
                              description: credits charged; null is unknown.
                        - required:
                          - credits_refunded
                          properties:
                            credits_refunded:
                              type:
                              - number
                              description: credits refunded; null is unknown.
                        - required:
                          - attempts
                          properties:
                            attempts:
                              type:
                              - number
                              description: attempts; null is unknown.
                        - required:
                          - progress
                          properties:
                            progress:
                              type:
                              - object
                              properties: {}
                              additionalProperties: true
                        - required:
                          - result
                          properties:
                            result:
                              type:
                              - object
                              properties: {}
                              additionalProperties: true
                        - required:
                          - error
                          properties:
                            error:
                              type:
                              - string
                              description: Failure details if present.
                              minLength: 1
                      x-contract-version: '2026-09-22'
                      x-validation-scope: Required success payload structure; optional fields and source completeness remain separate.
                      examples:
                      - id: job_example
                        status: queued
        default:
          description: The error envelope — the same shape for every non-2xx status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
