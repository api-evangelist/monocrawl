      operationId: snapchat_profile
      tags:
      - Snapchat
      summary: Snapchat profile
      description: 'A public Snapchat profile: name, bio, avatar, subscriber count, category, website and how many highlights and Spotlights it has. Costs 2 credits per successful live response.'
