        in: query
        required: true
        schema:
          type: string
        example: '3944'
        description: A Walmart category id
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Page number
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - best_match
          - price_low
          - price_asc
          - price_high
          - price_desc
          - best_seller
          - top_rated
        example: best_match
        description: 'best_match, price_low, price_high, best_seller or top_rated Accepted values: best_match, price_low, price_asc, price_high, price_desc, best_seller, top_rated. Case, spaces, hyphens and underscores are interchangeable.'
      - name: min_price
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Minimum price
      - name: max_price
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Maximum price
      - name: zip_code
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: ZIP code for local availability
      - name: store_id
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Store id
      - name: country
        in: query
        required: false
