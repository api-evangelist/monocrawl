      description: One aggregated job posting from Bing with its description and apply link. Costs 1 credit per successful live response. Bing job-detail lookup is unsupported. Use jobs/bing/search for available job summaries. No credits were charged. Returns 501 ENDPOINT_NOT_AVAILABLE.
