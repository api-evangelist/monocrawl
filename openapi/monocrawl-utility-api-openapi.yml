openapi: 3.2.0
info:
  title: Monocrawl Utility API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Utility
paths:
  /v1/utility/capabilities:
    get:
      operationId: utility_capabilities
      tags:
      - Utility
      summary: Parameter capabilities
      description: Accepted parameter capabilities from the current endpoint registry, with endpoint-specific descriptions, examples, prices and availability. Free metadata read; no suppliers are called. Filter by platform, endpoint/parameter search or HTTP method. Free — costs 0 credits.
      parameters:
      - name: param
        in: query
        required: false
        schema:
          type: string
        example: date_posted
        description: One accepted parameter name, such as date_posted, fit or dry_run. Omit for the complete index.
      - name: platform
        in: query
        required: false
        schema:
          type: string
        example: instagram
        description: Only capabilities used by endpoints for this platform.
      - name: search
        in: query
        required: false
        schema:
          type: string
        example: date_posted
        description: Literal case-insensitive match on endpoint identity, purpose, accepted parameter names and descriptions.
      - name: method
        in: query
        required: false
        schema:
          type: string
        example: GET
        description: 'HTTP method filter: GET, POST or DELETE.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/utility/capabilities.json
                      title: utility/capabilities data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        items:
                          type:
                          - array
