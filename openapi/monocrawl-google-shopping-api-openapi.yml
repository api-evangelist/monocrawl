  /v1/google_shopping/reviews:
    get:
      operationId: google_shopping_reviews
      tags:
      - Google Shopping
      summary: Google Shopping reviews
      description: Retrieve product reviews from Google Shopping. Reviewer details and source review IDs can be absent. Slow results return HTTP 202 with task_id and status_url; poll that URL at zero retrieval credits. The original task is charged once and terminal failures are refunded. Requested depth remains subject to available source capacity. Costs 5 credits per successful live response.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        example: '3896066944466806859'
        description: Google Shopping product gid (the gid on a google_shopping/search card)
      - name: docid
        in: query
        required: false
        schema:
          type: string
        example: '11901315168138976013'
        description: The card's docid, sent alongside for a precise match
      - name: product_id
        in: query
        required: false
        schema:
          type: string
        example: '4891805616949897996'
        description: The card's product id, sent alongside for a precise match
      - name: location
        in: query
        required: false
        schema:
          type: string
        example: United Kingdom
        description: Location name
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: en
        description: Language code
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '20'
        description: Requested reviews, 1–100 (default 20). Available source capacity can limit the maximum request. If no funded source can serve the requested depth, the API refuses it without a charge and reports the available limit; it does not silently reduce your request.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
