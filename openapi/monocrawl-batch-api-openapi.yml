openapi: 3.2.0
info:
  title: Monocrawl Batch API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Batch
  description: Run several requests in one HTTP call.
paths:
  /v1/youtube/channels:
    post:
      operationId: youtube_batch_channels
      tags:
      - Batch
      summary: Read YouTube channels with per-item billing
      description: 'Up to 20 independent reads, five at a time. Current single-item price: 1 credits. No wrapper fee; failed or empty items are uncharged. GET routes retain their existing behavior and price. A shared time budget leaves unstarted items uncharged. Pass Idempotency-Key for per-item replay protection.'
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                  description: Channel IDs, handles or URLs.
                urls:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                  description: Alternative to ids; supply one array only.
                fresh:
                  type: boolean
                dry_run:
                  type: boolean
                  description: Quote each item without executing paid reads.
                hl:
                  type: string
              oneOf:
              - required:
                - ids
              - required:
                - urls
      responses:
        '200':
          description: Ordered per-item results. Inspect every status, success and credits_used. credits_used is null when billing_complete is false; credits_confirmed is the known subtotal. Replayed items have zero new credits and preserve original_credits_used.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                $id: https://www.monocrawl.com/schemas/youtube/channels-batch.json
                title: youtube/channels-batch data fields
                description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                type: object
                properties:
                  success:
                    type:
                    - boolean
                    - 'null'
                  count:
                    type:
                    - number
                    - 'null'
                  succeeded:
                    type:
                    - number
                    - 'null'
                  failed:
                    type:
                    - number
                    - 'null'
                  credits_used:
                    type:
                    - number
                    - 'null'
                  credits_confirmed:
                    type:
                    - number
                    - 'null'
                  billing_complete:
                    type:
                    - boolean
                    - 'null'
                  results:
                    type:
                    - array
                    items:
                      type: object
                      properties:
                        index:
                          type:
                          - number
                          - 'null'
                        status:
                          type:
                          - number
                          - 'null'
                        success:
                          type:
                          - boolean
                          - 'null'
                        data:
                          description: Operation-specific JSON value; inspect the status and requested operation before reading it.
                        error:
                          type:
                          - object
                          - 'null'
                          properties: {}
                          additionalProperties: true
                        credits_used:
                          type:
                          - number
                          - 'null'
                        request_id:
                          type:
                          - string
                          - 'null'
                      additionalProperties: true
                      allOf:
                      - anyOf:
                        - required:
                          - index
                          properties:
                            index:
                              type:
                              - number
                        - required:
                          - success
                          properties:
                            success:
                              type:
                              - boolean
                        - required:
                          - data
                          properties:
                            data:
                              description: Operation-specific JSON value; inspect the status and requested operation before reading it.
                        - required:
                          - error
                          properties:
                            error:
                              type:
                              - object
                              properties: {}
                              additionalProperties: true
                        - required:
                          - credits_used
                          properties:
                            credits_used:
                              type:
                              - number
                        - required:
                          - request_id
                          properties:
                            request_id:
                              type:
                              - string
                              minLength: 1
                  dry_run:
                    type:
                    - boolean
                    - 'null'
                additionalProperties: true
                required:
                - results
                x-contract-version: '2026-09-22'
                x-validation-scope: Required success payload structure; optional fields and source completeness remain separate.
                examples:
                - success: false
                  count: 0
                  succeeded: 0
                  failed: 0
                  credits_used: 0
                  credits_confirmed: 0
                  billing_complete: false
                  results: []
                  dry_run: false
        default:
          description: Authentication or body validation failed before dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
