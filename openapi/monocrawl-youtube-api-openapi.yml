openapi: 3.2.0
info:
  title: Monocrawl YouTube API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Youtube
paths:
  /v1/youtube/channel:
    get:
      operationId: youtube_channel
      tags:
      - Youtube
      summary: YouTube channel
      description: 'Channel profile: title, handle, subscriber/view/video counts, avatar, banner and the uploads playlist id. Costs 1 credit per successful live response.'
      parameters:
      - name: channelId
        in: query
        required: false
        schema:
          type: string
        example: UC_x5XG1OV2P6uZZ5FSM9Ttw
        description: Channel id (UC…). One of channelId, handle, forUsername or url is required
      - name: handle
        in: query
        required: false
        schema:
          type: string
        example: '@googledevelopers'
        description: Channel @handle (with or without the @)
      - name: forUsername
        in: query
        required: false
        schema:
          type: string
        example: GoogleDevelopers
        description: Legacy channel username
      - name: url
        in: query
        required: false
        schema:
          type: string
        example: https://www.youtube.com/@googledevelopers
        description: Any channel URL (/channel/UC…, /@handle, /user/…, /c/…)
      - name: hl
        in: query
        required: false
        schema:
          type: string
        example: en
        description: BCP-47 language for localized snippet text
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: judgments
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'on'
          - 'off'
        example: 'on'
        description: 'Add bounded AI labels to eligible returned records (default on). off preserves the original data shape. Unclassified records remain present; labels depend on evidence, time, capacity and the existing request budget. No label surcharge. Accepted values: on, off. Case, spaces, hyphens and underscores are interchangeable.'
      - name: label
        in: query
        required: false
        schema:
          type: string
          enum:
          - default
          - none
        example: none
        description: 'Set none to disable labels; default enables the endpoint’s label set. Equivalent to judgments=off. Accepted values: default, none. Case, spaces, hyphens and underscores are interchangeable.'
      - name: label_evidence
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Include exact supporting sentences and zero-based sentence indexes when a label has validated evidence. No extra charge or change to decisions. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: exclude
        in: query
        required: false
        schema:
          type: string
          enum:
          - engagement_bait
        example: engagement_bait
        description: 'Optionally remove confidently labelled engagement bait. Uncertain and unclassified records stay; removed IDs and an owner-bound recall reference are returned. Accepted values: engagement_bait. Case, spaces, hyphens and underscores are interchangeable.'
      - name: fit
        in: query
        required: false
        schema:
          type: string
          enum:
          - goal
        example: goal
        description: 'Use goal to replace confidently irrelevant records with recall stubs. Keeps first, last, relevant and uncertain records; preserves order. Full evidence is stored for 24 hours when available. Accepted values: goal. Case, spaces, hyphens and underscores are interchangeable.'
      - name: goal
        in: query
        required: false
        schema:
          type: string
        example: Find concrete product complaints
        description: 'Required with fit=goal: describe the task in at most 600 characters. Supplied text is task context, never permission to act on posts.'
      - name: tokens
        in: query
        required: false
        schema:
          type: string
        example: '4000'
        description: Optional soft response target for fit=goal, 256–32000. Safety and evidence retention take priority, so the returned result may exceed it.
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/youtube/channel.json
                      title: youtube/channel data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: Source identifier. Preserve its exact string value; do not convert large IDs to numbers.
                        handle:
                          type:
                          - string
                          - 'null'
                          description: Public account username.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Display name.
                        url:
                          type:
                          - string
                          - 'null'
                          description: Original source URL when supplied.
                        description:
                          type:
                          - string
                          - 'null'
                          description: Channel description.
                        country:
                          type:
                          - string
                          - 'null'
                          description: Channel country when supplied.
                        subscribers:
                          type:
                          - number
                          - 'null'
                          description: Public subscribers; can be rounded reported by the source; null or absent is unknown, not zero.
                        subscribers_hidden:
                          type:
                          - boolean
                          - 'null'
                          description: Whether the source marks subscriber totals hidden.
                        views:
                          type:
                          - number
                          - 'null'
                          description: Channel views reported by the source; null or absent is unknown, not zero.
                        video_count:
                          type:
                          - number
                          - 'null'
                          description: Videos reported by the source; null or absent is unknown, not zero.
                        uploads_playlist_id:
                          type:
                          - string
                          - 'null'
                          description: Source identifier. Preserve its exact string value; do not convert large IDs to numbers.
                        _warnings:
                          type: array
                          items:
                            type: string
                          description: Collection limitations or component warnings. Read before interpreting coverage.
                      additionalProperties: true
                      allOf:
                      - anyOf:
                        - required:
                          - id
                          properties:
                            id:
                              type:
                              - string
                              description: Source identifier. Preserve its exact string value; do not convert large IDs to numbers.
                              minLength: 1
                        - required:
                          - handle
                          properties:
                            handle:
                              type:
                              - string
                              description: Public account username.
                              minLength: 1
                        - required:
                          - name
                          properties:
                            name:
                              type:
                              - string
                              description: Display name.
                              minLength: 1
                        - required:
                          - url
                          properties:
                            url:
                              type:
                              - string
                              description: Original source URL when supplied.
                              minLength: 1
                        - required:
                          - description
                          properties:
                            description:
                              type:
                              - string
                              description: Channel description.
                              minLength: 1
                        - required:
                          - country
                          properties:
                            country:
                              type:
                              - string
                              description: Channel country when supplied.
                              minLength: 1
                        - required:
                          - subscribers
                          properties:
                            subscribers:
                              type:
                              - number
                              description: Public subscribers; can be rounded reported by the source; null or absent is unknown, not zero.
                        - required:
                          - subscribers_hidden
                          properties:
                            subscribers_hidden:
                              type:
                              - boolean
                              description: Whether the source marks subscriber totals hidden.
                        - required:
                          - views
                          properties:
                            views:
                              type:
                              - number
                              description: Channel views reported by the source; null or absent is unknown, not zero.
                        - required:
                          - video_count
                          properties:
                            video_count:
                              type:
                              - number
                              description: Videos reported by the source; null or absent is unknown, not zero.
                        - required:
                          - uploads_playlist_id
                          properties:
                            uploads_playlist_id:
                              type:
                              - string
                              description: Source identifier. Preserve its exact string value; do not convert large IDs to numbers.
                              minLength: 1
                      x-contract-version: '2026-09-22'
                      x-validation-scope: Required success payload structure; optional fields and source completeness remain separate.
                      examples:
                      - id: UC_example
                        handle: '@example_channel'
                        name: Example Channel
                        subscribers: 12000
                        subscribers_hidden: false
                        views: 840000
                        video_count: 96
        default:
          description: The error envelope — the same shape for every non-2xx status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
