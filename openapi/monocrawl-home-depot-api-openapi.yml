        example: '204279858'
        description: Home Depot item id (the number at the end of its product URL), or the URL
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Page number
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - oldest
          - helpful
          - highest
          - lowest
          - photos
