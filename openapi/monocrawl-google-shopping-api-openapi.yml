  /v1/google_shopping/price-history:
    get:
      operationId: google_shopping_price_history
      tags:
      - Google Shopping
      summary: Google Shopping price history
      description: Available historical prices by store for a Google Shopping product in the requested country. Current offer prices and store URLs may be absent; use google_shopping/sellers for current offers. Returns available histories in one response; coverage varies by product and country. Costs 2 credits per successful live response.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        example: catalogid:7310953537322941042,productid:2695666608789071335
        description: Product id from google_shopping/search. Preserve its search country in location.
      - name: location
        in: query
        required: false
        schema:
          type: string
        example: United States
        description: Country name (default United Kingdom). Use the same country as the product search. The documented product example uses United States.
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: en
        description: Language code
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: Omit or use 1. The current source returns available store histories in one response; continuation is not supported.
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
