openapi: 3.2.0
info:
  title: Monocrawl App Store API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: App Store
paths:
  /v1/app_store/app-info:
    get:
      operationId: app_store_app_info
      tags:
      - App Store
      summary: App Store app details
      description: 'Full App Store app record: description, price, ratings, genres, screenshots, current version, release notes and size. similar_apps and more_apps_by_developer are filled only when the answering source supplies them (related_apps_included says which); the official store lookup does not carry them. Costs 1 credit per successful live response.'
      parameters:
      - name: app_id
        in: query
        required: true
        schema:
          type: string
        example: '324684580'
        description: Numeric App Store track id, or a bundle id like com.spotify.client
      - name: country
        in: query
        required: false
        schema:
          type: string
        example: us
        description: 2-letter storefront country code (default us)
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: en_us
        description: Result language code (e.g. en_us, ja_jp)
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/app_store/app-info.json
                      title: app_store/app-info data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: Numeric App Store track ID represented as a string.
                        bundle_id:
                          type:
                          - string
                          - 'null'
                          description: iOS bundle identifier.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Listing name.
                        url:
                          type:
                          - string
                          - 'null'
                          description: Original source URL when supplied.
                        developer:
                          type: object
                          properties:
                            id:
                              type:
                              - string
                              - 'null'
                              description: Source identifier. Preserve its exact string value; do not convert large IDs to numbers.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Developer name.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Original source URL when supplied.
                          additionalProperties: true
                        price:
                          type: object
                          properties:
                            amount:
                              type:
                              - number
                              - 'null'
                              description: Price amount.
                            currency:
                              type:
                              - string
                              - 'null'
                              description: Currency code.
                            free:
                              type:
                              - boolean
                              - 'null'
                              description: Whether the amount is zero.
                          additionalProperties: true
                        rating:
                          type: object
                          properties:
                            average:
                              type:
                              - number
                              - 'null'
                              description: Source average rating on a five-star scale.
                            count:
                              type:
                              - number
                              - 'null'
                              description: Ratings reported by the source; null or absent is unknown, not zero.
                            current_version_average:
                              type:
                              - number
                              - 'null'
                              description: Current-version average.
                            current_version_count:
                              type:
                              - number
                              - 'null'
                              description: Current-version ratings reported by the source; null or absent is unknown, not zero.
                          additionalProperties: true
                        version:
                          type:
                          - string
                          - 'null'
