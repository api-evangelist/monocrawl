                      additionalProperties: true
                      allOf:
                      - anyOf:
                        - required:
                          - id
                          properties:
                            id:
                              type:
                              - string
                              description: Numeric App Store track ID represented as a string.
                              minLength: 1
                        - required:
                          - bundle_id
                          properties:
                            bundle_id:
                              type:
                              - string
                              description: iOS bundle identifier.
                              minLength: 1
                        - required:
                          - name
                          properties:
                            name:
                              type:
                              - string
                              description: Listing name.
                              minLength: 1
                        - required:
                          - url
                          properties:
                            url:
                              type:
                              - string
                              description: Original source URL when supplied.
                              minLength: 1
                        - required:
                          - developer
                          properties:
                            developer:
                              type: object
                              properties:
                                id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Source identifier. Preserve its exact string value; do not convert large IDs to numbers.
                                name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Developer name.
                                url:
                                  type:
                                  - string
                                  - 'null'
                                  description: Original source URL when supplied.
                              additionalProperties: true
                        - required:
                          - price
                          properties:
                            price:
                              type: object
                              properties:
                                amount:
                                  type:
                                  - number
                                  - 'null'
                                  description: Price amount.
                                currency:
                                  type:
                                  - string
                                  - 'null'
                                  description: Currency code.
                                free:
                                  type:
                                  - boolean
                                  - 'null'
                                  description: Whether the amount is zero.
                              additionalProperties: true
                        - required:
                          - rating
                          properties:
                            rating:
                              type: object
                              properties:
                                average:
                                  type:
                                  - number
                                  - 'null'
                                  description: Source average rating on a five-star scale.
                                count:
                                  type:
                                  - number
                                  - 'null'
                                  description: Ratings reported by the source; null or absent is unknown, not zero.
                                current_version_average:
                                  type:
                                  - number
                                  - 'null'
                                  description: Current-version average.
                                current_version_count:
                                  type:
                                  - number
                                  - 'null'
                                  description: Current-version ratings reported by the source; null or absent is unknown, not zero.
                              additionalProperties: true
                        - required:
                          - version
                          properties:
                            version:
                              type:
                              - string
                              description: Listing version.
                              minLength: 1
                        - required:
                          - size_bytes
                          properties:
                            size_bytes:
                              type:
                              - number
                              description: Download size in bytes.
                        - required:
                          - description
                          properties:
                            description:
                              type:
                              - string
                              description: Full listing description when returned.
                              minLength: 1
                      x-contract-version: '2026-09-22'
                      x-validation-scope: Required success payload structure; optional fields and source completeness remain separate.
