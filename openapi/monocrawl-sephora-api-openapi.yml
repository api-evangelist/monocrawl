        required: true
        schema:
          type: string
        example: '2495505'
        description: Sku id from sephora/product
      - name: latitude
        in: query
        required: true
        schema:
          type: string
        example: '41.7887'
        description: Latitude
      - name: longitude
        in: query
        required: true
        schema:
          type: string
        example: '-87.7665'
        description: Longitude
      - name: radius
        in: query
        required: false
        schema:
          type: string
        example: '50'
        description: Miles
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
