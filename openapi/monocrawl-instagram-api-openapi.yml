tags:
- name: Instagram
paths:
  /v1/instagram/about:
    get:
      operationId: instagram_about
      tags:
      - Instagram
      summary: Instagram account transparency panel
      description: 'Public account transparency: country, month joined and verification status when supplied. Unknown ads and former-name counts remain null. Handle lookup is included in the credit price. Costs 10 credits per successful live response.'
      parameters:
      - name: handle
        in: query
        required: true
        schema:
          type: string
        example: nasa
        description: Instagram username or profile URL An optional leading @ is accepted and removed before lookup.
      - name: user_id
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: 'The numeric account id, if already known: skips the lookup request'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/instagram/about.json
                      title: instagram/about data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        handle:
                          type:
                          - string
                          - 'null'
                          description: handle
                        url:
                          type:
                          - string
                          - 'null'
                          description: url
                        date_joined:
                          type:
                          - string
                          - 'null'
                          description: date joined
                        country:
                          type:
                          - string
                          - 'null'
                          description: country
                        verified_on:
                          type:
                          - string
                          - 'null'
                          description: verified on
                        active_ads:
                          type:
                          - string
                          - 'null'
                          description: active ads
                        former_usernames_count:
                          type:
                          - number
                          - 'null'
                          description: former usernames count; null is unknown.
                        accounts_with_shared_followers:
                          type:
                          - number
                          - 'null'
                          description: accounts with shared followers; null is unknown.
                        verified:
                          type:
                          - boolean
                          - 'null'
                          description: Source verification flag.
                      additionalProperties: true
                      allOf:
                      - anyOf:
                        - required:
                          - handle
                          properties:
                            handle:
                              type:
                              - string
                              description: handle
                              minLength: 1
                        - required:
                          - url
                          properties:
                            url:
                              type:
                              - string
                              description: url
                              minLength: 1
                        - required:
                          - date_joined
                          properties:
                            date_joined:
                              type:
                              - string
                              description: date joined
                              minLength: 1
                        - required:
