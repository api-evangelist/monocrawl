  /v1/web/batch-scrape:
    get:
      operationId: web_batch_scrape
      tags:
      - Web Scraping
      summary: Start an async batch scrape
      description: Scrape up to 25 URLs in one background job and get a job id back immediately; individual URL failures are reported per item and never fail the batch. Costs 3 credits per successful live response.
      parameters:
      - name: urls
        in: query
        required: true
        schema:
          type: string
        example: https://example.com,https://www.iana.org
        description: Comma-separated list or JSON array of URLs to scrape (max 25 per job)
      - name: formats
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - markdown
            - text
            - links
        style: form
        explode: false
        example:
        - markdown
        description: 'Comma-separated subset of markdown,text,links (default markdown) Accepted values (comma-separated): markdown, text, links. Case, spaces, hyphens and underscores are interchangeable.'
      - name: only_main_content
        in: query
        required: false
        schema:
          type: string
        example: 'true'
        description: Render only the main content region of each page (default true)
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/web/batch-scrape.json
                      title: web/batch-scrape data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        job_id:
                          type: string
                          minLength: 1
                          description: Owner-scoped job identifier. Use check to read its status and result.
                        check:
                          type: string
                          minLength: 1
                          description: Relative GET path for this job. Authenticate with the same owning account.
                        status:
                          type: string
                          minLength: 1
                          description: Job status at enqueue time; this is not a completed crawl or batch result.
                        kind:
                          type: string
                          minLength: 1
                          description: 'Stored job kind: crawl or batch_scrape.'
                        created_at:
                          type:
                          - string
                          - 'null'
                          description: Source date or timestamp; absent dates remain unknown.
                        credits_charged:
                          type:
                          - number
                          - 'null'
                          description: Credits charged when the job was accepted.
                        params:
                          type: object
                          properties: {}
                          additionalProperties: true
                          description: Resolved job parameters, including applied defaults and limits.
                        _warnings:
                          type: array
                          items:
                            type: string
                      additionalProperties: true
                      required:
                      - job_id
                      - check
                      - status
                      - kind
                      - params
                      allOf:
                      - anyOf:
                        - required:
                          - job_id
                          properties:
                            job_id:
                              type: string
                              minLength: 1
                              description: Owner-scoped job identifier. Use check to read its status and result.
                        - required:
                          - check
                          properties:
                            check:
                              type: string
                              minLength: 1
                              description: Relative GET path for this job. Authenticate with the same owning account.
                        - required:
                          - created_at
                          properties:
                            created_at:
                              type:
                              - string
                              description: Source date or timestamp; absent dates remain unknown.
                              minLength: 1
                        - required:
                          - credits_charged
                          properties:
                            credits_charged:
                              type:
                              - number
                              description: Credits charged when the job was accepted.
                        - required:
                          - params
                          properties:
                            params:
                              type: object
                              properties: {}
                              additionalProperties: true
                              description: Resolved job parameters, including applied defaults and limits.
                      x-contract-version: '2026-09-22'
                      x-validation-scope: Required success payload structure; optional fields and source completeness remain separate.
                      examples:
                      - job_id: job_example
                        check: /v1/web/jobs/job_example
                        status: queued
                        kind: batch_scrape
                        params:
                          urls:
                          - https://example.com/
                          formats: markdown
                          only_main_content: true
