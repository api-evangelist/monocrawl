      x-availability-scope: Structural check of the effective registered chain, production permission, adapter, configured cost and quality floor without request parameters. True is not a live-health, credential, quota, subscription-entitlement, complete-data or deployment-exposure guarantee. False means no structurally eligible candidate; null means metadata could not establish availability. Composite child capability still depends on its component routes.
      x-live-proven: true
  /v1/monitors/create:
    get:
      operationId: monitors_create
      tags:
      - Monitors
      summary: Create a monitor
      description: Save a monitor and its schedule. A subject monitor follows a resolved name across platforms and records new findings; a feed monitor records new items from a review or listing endpoint; a change monitor snapshots a page or endpoint. Creating costs the listed credits. Each run reserves its quoted credits before starting; unused reserved credits are refunded. Runs pause if available account funding cannot cover the next check. No monthly monitor cap applies. Costs 1 credit per successful live response.
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - subject
          - feed
          - change
        example: subject
        description: 'What kind of monitor: subject (a name, handle, product or topic followed across platforms), feed (new items from one review or listing endpoint) or change (a page or endpoint snapshot, the original monitor). Defaults to subject when query is given, change otherwise. Accepted values: subject, feed, change. Case, spaces, hyphens and underscores are interchangeable.'
      - name: query
        in: query
        required: false
        schema:
          type: string
        example: Monzo
        description: 'What to watch: a name, product, handle, domain or keyword for a subject monitor; for a feed template, its identifier — a subreddit, a video link, an app id, or for Google Maps reviews a pasted Maps link or a Place id (a link is resolved through one places search, charged once).'
      - name: entity
        in: query
        required: false
        schema:
          type: string
        example: bare
        description: 'subject: the sense id chosen from a preview or a clarification (bare for the plain name, sense:… for a qualified one)'
      - name: entity_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - creator_media
          - developer
          - brand
          - company
          - event
          - community
        example: brand
        description: 'subject: creator_media, developer, brand, company, event or community — guides source routing Accepted values: creator_media, developer, brand, company, event, community. Case, spaces, hyphens and underscores are interchangeable.'
      - name: purpose
        in: query
        required: false
        schema:
          type: string
        example: complaints
        description: A preset id (brand_mentions, complaints, competitor_activity, switching_intent, purchase_intent, questions, developments, app_reviews, local_reviews, custom) or a short free-text purpose
      - name: sources
        in: query
        required: false
        schema:
          type: string
        example: reddit,x,hackernews
        description: 'subject: platforms to search, comma-separated; defaults to the preset''s recommendation'
      - name: exclude
        in: query
        required: false
        schema:
          type: string
        example: tiktok
        description: 'subject: platforms to leave out'
      - name: relationships
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - independent_audience
            - editorial_news
            - official_owned
            - employee_team
            - collaborator_partner
            - fan_clip
        style: form
        explode: false
        example:
        - independent_audience
        - editorial_news
        description: 'subject: which classes of material count as findings (official_owned, employee_team, collaborator_partner, editorial_news, fan_clip, independent_audience). Default: everything except unrelated material. Accepted values (comma-separated): independent_audience, editorial_news, official_owned, employee_team, collaborator_partner, fan_clip. Case, spaces, hyphens and underscores are interchangeable.'
      - name: filters
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - complaints
            - switching
            - buying
            - bugs_crashes
            - bugs_glitches
            - bugs_exploits
            - bugs_blockers
            - bugs_performance
            - requests
            - questions
        style: form
        explode: false
        example:
        - complaints
        description: 'subject: deterministic purpose filters applied to findings: complaints, switching, buying, questions Accepted values (comma-separated): complaints, switching, buying, bugs_crashes, bugs_glitches, bugs_exploits, bugs_blockers, bugs_performance, requests, questions. Case, spaces, hyphens and underscores are interchangeable.'
      - name: aliases
        in: query
        required: false
        schema:
          type: string
        example: '@monzo,Monzo Bank'
        description: 'subject: other names the subject is known by, comma-separated'
      - name: max_metered
        in: query
        required: false
        schema:
          type: string
        example: '1'
        description: 'subject: how many metered platforms each run may spend on, 0-2 (default 1)'
      - name: lookback_days
        in: query
        required: false
        schema:
          type: string
        example: '7'
        description: 'subject: how far back the first run looks (default 7); later runs continue from the last successful run'
      - name: feed_platform
        in: query
        required: false
        schema:
          type: string
        example: app_store
        description: 'feed: platform of the review or listing endpoint'
      - name: feed_endpoint
        in: query
        required: false
        schema:
          type: string
        example: app-reviews
        description: 'feed: endpoint id, e.g. app-reviews'
      - name: feed_params_json
        in: query
        required: false
        schema:
          type: string
        example: '{"app_id":"310633997"}'
        description: 'feed: JSON object of parameters for the endpoint'
      - name: schedule_minutes
        in: query
        required: false
        schema:
          type: string
        example: '1440'
        description: Minutes between runs. The console offers 60, 360, 1440 and 10080; the API accepts any value from 15 to 43200.
      - name: monthly_cap_credits
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Legacy field accepted for compatibility but ignored and returned as null. It does not impose a spending cap. Account balance, quoted run cost and existing account safeguards still apply.
      - name: delivery_in_app
        in: query
        required: false
        schema:
          type: string
        example: 'true'
        description: Create an in-app notification when a run finds something new (default true)
      - name: delivery_webhook
        in: query
        required: false
        schema:
          type: string
        example: 'true'
        description: Emit monitor.findings to your signed webhook endpoints (default false)
      - name: name
        in: query
        required: false
        schema:
          type: string
        example: Monzo complaints
        description: Human label; suggested from the purpose and subject when omitted
      - name: url
        in: query
        required: false
        schema:
          type: string
        example: https://example.com/pricing
        description: 'change: page to watch. Give this OR platform+endpoint.'
      - name: platform
        in: query
        required: false
        schema:
          type: string
        example: github
        description: 'change: platform of an API endpoint to watch, e.g. github. Give with endpoint.'
      - name: endpoint
        in: query
        required: false
        schema:
          type: string
        example: repo
        description: 'change: endpoint id to watch, e.g. repo'
      - name: params_json
        in: query
        required: false
        schema:
          type: string
        example: '{"owner":"vercel","repo":"next.js"}'
        description: 'change: JSON object of parameters passed to the watched endpoint on every run'
      - name: output
        in: query
        required: false
        schema:
          type: string
          enum:
          - report
          - everything
        example: report
        description: 'subject and feed: report (each run leads with what changed and why it matters, every line with its receipts; the default for the intelligence templates) or everything (every new post, comment or review, listed; the default for feeds and follow templates) Accepted values: report, everything. Case, spaces, hyphens and underscores are interchangeable.'
      - name: destinations
        in: query
        required: false
        schema:
          type: string
        example: '[{"kind":"endpoint","endpoint_id":"whk_…","cadence":"immediate","min_severity":"notable"},{"kind":"email","cadence":"daily"}]'
        description: 'JSON array of where alerts go and how often. kind: email (the account address), endpoint (one of your Slack channels, Discord channels or webhooks by endpoint_id; omit endpoint_id for every active endpoint), push (the devices that turned push on). cadence: immediate, daily or weekly. min_severity for immediate: info (every new finding), notable or critical. The monitor page is always included unless delivery_in_app=false. Replaces delivery_email, delivery_webhook and delivery_mode when given.'
      - name: feeds_json
        in: query
        required: false
        schema:
          type: string
        example: '[{"platform":"bluesky","endpoint":"user/posts","params":{"handle":"name.bsky.social"}},{"platform":"youtube","endpoint":"channel/videos","params":{"handle":"name"}}]'
        description: 'Several feeds at once, as a JSON array of {platform, endpoint, params}. Follow an account reads timelines: x/tweets (handle, metered), bluesky/user/posts (handle), youtube/channel/videos (handle or url). Every feed must be live-proven on this deployment; the review says so per feed.'
      - name: expected_run_credits
        in: query
        required: false
        schema:
          type: string
        example: '2'
        description: 'Optional quote guard: refuse creation when the resolved per-run price differs. Obtain a quote from monitors/test first.'
      - name: result_mode
        in: query
        required: false
        schema:
          type: string
        example: snapshot
        description: 'Change/endpoint monitors: snapshot saves each bounded response without AI; changes applies existing comparison rules (default). One request per check, no automatic pagination. Responses above 200 KB are not retained.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: rules
        in: query
        required: false
        schema:
          type: string
        example: '{"metric_fields":["/followers"]}'
        description: Optional change-monitor rules as a JSON object. Use metric_fields with up to 10 published numeric object JSON pointers (for example /followers or /stats/likes), with result_mode=changes. Unknown/nonnumeric paths are rejected before a source call or charge; missing actual values are not zero and the check is refunded. Numeric selection replaces family rules. Or use watch_fields for generic field comparisons. See /docs/monitors#metric-fields.
      - name: relevance_enabled
        in: query
        required: false
        schema:
          type: string
        example: 'true'
        description: Optional on every monitor. Enable or disable relevance filtering. Enabling requires a nonempty relevance_prompt.
      - name: relevance_prompt
        in: query
        required: false
        schema:
          type: string
        example: Only genuine requests for recommendations; exclude promotions.
        description: Up to 600 characters describing what should trigger an alert. A nonempty value enables filtering unless explicitly disabled. Empty clears it.
      - name: exclusions
        in: query
        required: false
        schema:
          type: string
        example: sponsored,job opening
        description: Comma-separated phrases skipped before AI; empty clears. Returned by monitor read tools.
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
        '200':
          description: 'The common success envelope; `data` is endpoint-specific. Many lists use items/count/cursor; bundles use named collections and their documented continuation metadata. HTTP 200 can contain a partial bundle: inspect complete, partial and legs where supplied.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $schema: https://json-schema.org/draft/2020-12/schema
                      $id: https://www.monocrawl.com/schemas/monitors/create.json
                      title: monitors/create data fields
                      description: Required core structure for successful data, with optional source fields. Additional fields are allowed. This is not a completeness guarantee.
                      type: object
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          description: Exact source identifier; preserve it as a string.
                        status:
                          type:
