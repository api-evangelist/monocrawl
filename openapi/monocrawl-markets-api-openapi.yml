  /v1/finance/statements:
    get:
      operationId: finance_statements
      tags:
      - Markets
      summary: Company financial statements
      description: 'Income statement, balance sheet or cash-flow statement of a listed company, one row per fiscal period: annual rows for each fiscal year, quarter-end rows with trailing-twelve-month figures, plus the latest trailing twelve months. Costs 3 credits per successful live response.'
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: AAPL
        description: Ticker symbol
      - name: statement
        in: query
        required: false
        schema:
          type: string
          enum:
          - income
          - balance
          - cash
        x-value-aliases:
          pl: income
          profit and loss: income
          income statement: income
          balance sheet: balance
          cash flow: cash
        example: income
        description: 'income, balance or cash Accepted values: income, balance, cash. Case, spaces, hyphens and underscores are interchangeable.'
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - annual
          - quarterly
        x-value-aliases:
          quarter: quarterly
          quarters: quarterly
          ttm: quarterly
          year: annual
          years: annual
          yearly: annual
        example: all
        description: 'all, annual or quarterly Accepted values: all, annual, quarterly. Case, spaces, hyphens and underscores are interchangeable.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
