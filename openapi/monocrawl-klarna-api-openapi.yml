        in: query
        required: true
        schema:
          type: string
        example: cl94
        description: Category id, e.g. cl94
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - popularity
          - price_asc
          - price_desc
          - trend
          - name
          - rating
          - price_drop
        example: popularity
        description: 'popularity, price_asc, price_desc, trend, name, rating or price_drop Accepted values: popularity, price_asc, price_desc, trend, name, rating, price_drop. Case, spaces, hyphens and underscores are interchangeable.'
      - name: price_range
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Price band such as 50-500
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '48'
        description: Products per page, at most 48
      - name: cursor
        in: query
        required: false
        schema:
