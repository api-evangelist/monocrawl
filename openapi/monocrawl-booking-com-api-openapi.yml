openapi: 3.2.0
info:
  title: Monocrawl Booking.com API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Booking.com
paths:
  /v1/booking/attraction:
    get:
      operationId: booking_attraction
      tags:
      - Booking.com
      summary: Booking.com attraction
      description: 'One attraction''s page: description, price, rating and reviews, cancellation, operator, what is included and not, languages, photos, meeting and departure addresses, offers and the latest reviews. Costs 3 credits per successful live response.'
      parameters:
      - name: slug
        in: query
        required: true
        schema:
          type: string
        example: pr4z1zrjq9hl-skip-the-queue-tickets-into-the-lisbon-oceanarium
        description: The attraction's slug from booking/search-attractions (or pass url, its page)
      - name: url
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: The attraction's page URL instead of a slug
      - name: currency
        in: query
        required: false
        schema:
          type: string
        example: GBP
        description: Three-letter currency code
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Language code for the site's text
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
      security:
      - ApiKeyHeader: []
      - BearerKey: []
      responses:
