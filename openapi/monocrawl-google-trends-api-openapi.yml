- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Google Trends
paths:
  /v1/google_trends/interest:
    get:
      operationId: google_trends_interest
      tags:
      - Google Trends
      summary: Google Trends interest
      description: Interest over time for up to five terms on Google Trends. Costs 4 credits per successful live response.
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        example: electric bikes
        description: Up to five terms, comma-separated
      - name: location
        in: query
        required: false
        schema:
          type: string
        example: United Kingdom
        description: Location name; worldwide when empty
      - name: time_range
        in: query
        required: false
        schema:
          type: string
          enum:
          - past_hour
          - past_4_hours
          - past_day
          - past_7_days
          - past_30_days
          - past_90_days
          - past_12_months
          - past_5_years
          - 2004_present
          - 2008_present
        example: past_12_months
        description: 'Time window: 2004_present requires type=web; 2008_present requires news, youtube, images or froogle. Omit for the default window. Accepted values: past_hour, past_4_hours, past_day, past_7_days, past_30_days, past_90_days, past_12_months, past_5_years, 2004_present, 2008_present. Case, spaces, hyphens and underscores are interchangeable.'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - web
          - news
          - youtube
          - images
          - froogle
        example: web
        description: 'web, news, youtube, images or froogle Accepted values: web, news, youtube, images, froogle. Case, spaces, hyphens and underscores are interchangeable.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
