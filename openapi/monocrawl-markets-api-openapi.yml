openapi: 3.2.0
info:
  title: Monocrawl Markets API
  version: 0.1.0
  description: One key, one envelope, one credit meter across social, search, commerce and web data.
  contact:
    name: Monocrawl support
    url: https://www.monocrawl.com/contact
  termsOfService: https://www.monocrawl.com/legal/terms-and-conditions
servers:
- url: https://www.monocrawl.com
security:
- ApiKeyHeader: []
tags:
- name: Markets
paths:
  /v1/finance/history:
    get:
      operationId: finance_history
      tags:
      - Markets
      summary: Price history
      description: OHLCV bars for one instrument over a range at an interval. Costs 1 credit per successful live response.
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        example: AAPL
        description: Ticker symbol
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1m
          - 2m
          - 5m
          - 15m
          - 30m
          - 60m
          - 90m
          - 1h
          - 1d
          - 5d
          - 1wk
          - 1mo
          - 3mo
        example: 1d
        description: '1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo or 3mo Accepted values: 1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo, 3mo. Case, spaces, hyphens and underscores are interchangeable.'
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1d
          - 5d
          - 7d
          - 15d
          - 1mo
          - 3mo
          - 6mo
          - 1y
          - 2y
          - 5y
          - 10y
          - ytd
          - max
        example: 1mo
        description: '1d, 5d, 7d, 15d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd or max Accepted values: 1d, 5d, 7d, 15d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd, max. Case, spaces, hyphens and underscores are interchangeable.'
      - name: dry_run
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - '0'
          - 'true'
          - 'false'
        example: '1'
        description: 'Read a zero-credit estimate without fetching sources, running AI, or reserving credits. Cache status is a snapshot, not a guarantee at execution. Accepted values: 1, 0, true, false. Case, spaces, hyphens and underscores are interchangeable.'
      - name: X-Max-Credits
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        example: 5
        description: Optional credit reservation ceiling for this individual request. Send a non-negative integer in decimal digits. Live execution checks the required reservation after resolving free cache hits or buffered continuation, before charging or calling a supplier. A higher reservation returns HTTP 422 INVALID_PARAMETERS with reason max_credits_exceeded and charges nothing. Invalid header values also return 422. Zero permits only a zero-credit reservation; omitting the header uses normal pricing. dry_run remains a free preview. This does not cap later requests, batches or scheduled runs.
