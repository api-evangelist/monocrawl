        required: false
        schema:
          type: string
        example: '1'
        description: Page of 15 products
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - g2-score
          - popularity
          - satisfaction
        example: g2-score
        description: 'g2-score, popularity or satisfaction Accepted values: g2-score, popularity, satisfaction. Case, spaces, hyphens and underscores are interchangeable.'
