        description: 'active to resume runs, paused to stop them. Pausing clears the next run time; resuming schedules the next run one interval from now. Accepted values: active, paused. Case, spaces, hyphens and underscores are interchangeable.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        example: Monzo complaints
        description: New label; pass an empty string to clear it
      - name: schedule_minutes
        in: query
        required: false
        schema:
          type: string
        example: '1440'
        description: New interval between runs; minimum 15, maximum 43200. Rescheduling re-times the next run from now.
      - name: monthly_cap_credits
        in: query
        required: false
        schema:
          type: string
        example: ''
        description: Legacy field accepted for compatibility but ignored and returned as null. It does not impose a spending cap. Account balance, quoted run cost and existing account safeguards still apply.
      - name: delivery_in_app
        in: query
        required: false
        schema:
          type: string
        example: 'true'
        description: 'subject/feed: in-app notifications on or off'
      - name: delivery_webhook
        in: query
        required: false
