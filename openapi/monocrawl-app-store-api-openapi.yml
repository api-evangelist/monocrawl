  /v1/app_store/app-list:
    get:
      operationId: app_store_app_list
      tags:
      - App Store
      summary: App Store top charts
      description: Apple Marketing Tools top-free / top-paid app chart for a storefront, ranked. Costs 2 credits per successful live response.
      parameters:
      - name: app_collection
        in: query
        required: true
        schema:
          type: string
          enum:
          - top-free
          - top-paid
          - topfreeapplications
          - toppaidapplications
          - top-grossing
          - new
          - new-free
          - new-paid
        example: top-free
        description: 'Chart collection. top-free and top-paid use the public charts feed; other collections require eligible alternate coverage. Accepted values: top-free, top-paid, topfreeapplications, toppaidapplications, top-grossing, new, new-free, new-paid. Case, spaces, hyphens and underscores are interchangeable.'
      - name: app_category
        in: query
        required: false
        schema:
          type: string
        example: '6014'
        description: Not supported by the Apple charts feed; acknowledged in _warnings and ignored
      - name: country
        in: query
        required: false
        schema:
          type: string
        example: us
        description: 2-letter storefront country code (default us)
      - name: language
        in: query
        required: false
        schema:
          type: string
        example: en_us
        description: Not supported by the charts feed; acknowledged in _warnings and ignored
      - name: depth
        in: query
        required: false
        schema:
          type: string
        example: '100'
        description: Requested results, 1–100 (default 100); the source may return fewer. No per-item detail enrichment.
      - name: dry_run
        in: query
        required: false
        schema:
